<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#2563eb,#0ea5e9);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:#fff;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    max-width:750px;
    padding:40px;
}

.logo{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#fff;
    color:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
    margin:auto;
    margin-bottom:25px;
}

h1{
    font-size:60px;
    font-weight:700;
}

h2{
    font-size:28px;
    color:#facc15;
    margin:10px 0 20px;
}

p{
    font-size:18px;
    color:#ddd;
    line-height:1.7;
    margin-bottom:35px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:35px;
}

.box{
    width:100px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
}

.box h3{
    font-size:35px;
}

.box span{
    font-size:14px;
    color:#ddd;
}

form{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

input{
    padding:15px;
    width:300px;
    border:none;
    border-radius:50px;
    outline:none;
    font-size:16px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:50px;
    background:#facc15;
    color:#111;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#fff;
}

.footer{
    margin-top:40px;
    color:#ccc;
    font-size:15px;
}

@media(max-width:768px){

h1{
    font-size:42px;
}

h2{
    font-size:22px;
}

.box{
    width:80px;
}

.box h3{
    font-size:28px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="logo">🚀</div>

<h1>Coming Soon</h1>

<h2>We're Launching Something Amazing!</h2>

<p>
Our website is currently under construction.
We're working hard to bring you an amazing experience.
Stay connected and we'll notify you once we're live.
</p>

<div class="countdown">
<div class="box">
<h3 id="days">00</h3>
<span>Days</span>
</div>

<div class="box">
<h3 id="hours">00</h3>
<span>Hours</span>
</div>

<div class="box">
<h3 id="minutes">00</h3>
<span>Minutes</span>
</div>

<div class="box">
<h3 id="seconds">00</h3>
<span>Seconds</span>
</div>
</div>

<form>
<input type="email" placeholder="Enter your email">
<button>Notify Me</button>
</form>

<div class="footer">
© 2026 Your Company. All Rights Reserved.
</div>

</div>

<script>

const launchDate = new Date("December 31, 2026 23:59:59").getTime();

setInterval(function(){

const now = new Date().getTime();

const distance = launchDate - now;

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=days;
document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

},1000);

</script>

</body>
</html>
